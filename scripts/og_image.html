<!doctype html><html><head><meta charset="utf-8">
<!-- Source for src/betting_dashboard/assets/og-image.png (social preview card).
     Open in a browser at a 1200x630 viewport and screenshot it. Update the figures if the data changes. -->
<link rel="stylesheet" href="../src/betting_dashboard/assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="../src/betting_dashboard/assets/vendor/inter/inter.css">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;font-family:Inter,sans-serif;color:#e6ebf5;
 background:radial-gradient(900px 500px at 85% 0%,rgba(245,158,11,.22),transparent 60%),#0b1220;
 padding:64px 72px;display:flex;flex-direction:column;justify-content:space-between}
.brand{display:flex;align-items:center;gap:16px;font-weight:800;font-size:34px;letter-spacing:-.01em}
.mark{width:56px;height:56px;border-radius:14px;background:#f59e0b;color:#111;display:grid;place-items:center;font-size:32px}
h1{font-size:62px;line-height:1.06;font-weight:800;letter-spacing:-.03em;max-width:980px}
h1 em{font-style:normal;color:#f59e0b}
.stats{display:flex;gap:18px}
.stat{flex:1;background:#111a2e;border:1px solid #1f2a44;border-radius:18px;padding:20px 24px}
.v{font-size:40px;font-weight:800;letter-spacing:-.02em}.g{color:#22c55e}
.l{color:#8a96b0;font-size:19px;margin-top:4px;font-weight:500}
</style></head><body>
<div class="brand"><span class="mark"><i class="bi bi-dribbble"></i></span>Courtside Analytics</div>
<h1>A basketball prediction model, <em>graded honestly</em>.</h1>
<div class="stats">
 <div class="stat"><div class="v g">+3.5% ROI</div><div class="l">Recommended totals picks</div></div>
 <div class="stat"><div class="v">1,292</div><div class="l">Graded predictions</div></div>
 <div class="stat"><div class="v">35,326</div><div class="l">Games · 11 leagues · 2010–21</div></div>
</div></body></html>
