# Render Blueprint: https://render.com/docs/blueprint-spec
# In Render: New + > Blueprint > pick this repo. Deploys automatically on every push to main.
services:
  - type: web
    name: betting-dashboard
    runtime: docker
    plan: free # "starter" removes cold starts
    branch: main
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: APP_NAME
        value: Courtside Analytics
      # 512 MB on the free plan: one worker (~250 MB) with threads. Raise on a bigger plan.
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_THREADS
        value: "4"
