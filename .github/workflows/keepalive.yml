name: Keep-alive

# Render's free plan spins the service down after ~15 minutes without traffic, and the next
# visitor waits 30-60 s for a cold start. Ping the health check every 10 minutes during
# European and US working hours (06:00-21:59 UTC) so visitors get a warm instance.
#
# The target defaults to the live site. To ping another URL, set the SITE_URL repository
# variable (Settings > Secrets and variables > Actions > Variables). To pause the pings,
# disable this workflow from the Actions tab.
# Note: GitHub disables scheduled workflows after 60 days without repository activity;
# re-enable it from the Actions tab if that happens.

on:
  schedule:
    - cron: "*/10 6-21 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /healthz
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://betting-dashboard.onrender.com' }}
        run: |
          curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 10 \
            "${SITE_URL%/}/healthz"
