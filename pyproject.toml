[project]
name = "betting-dashboard"
version = "2.0.0"
description = "Basketball betting analytics: model track record, predictions and 35k historical games across 11 leagues."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dash>=4.4,<5",
    "dash-bootstrap-components>=2.0,<3",
    "dash-ag-grid>=35.3,<36",
    "pandas>=3.0,<4",
    "plotly>=7.0,<8",
    "pyarrow>=21",
    "gunicorn>=23",
    "flask-compress>=1.17",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/betting_dashboard"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PD", "RUF"]
# En dashes and minus signs in UI copy are intentional typography.
ignore = ["RUF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
